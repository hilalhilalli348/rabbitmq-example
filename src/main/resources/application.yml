spring:
  application:
    name: rabbitmq-example
  rabbitmq:
    host: localhost
    username: guest
    password: guest
    port: 5672

properties:
  rabbitmq:
    exchange-name: user.events.topic
    pattern: user.*
    routing-key-name: user.created
    queue-name: notification.user-created

server:
  port: 8080
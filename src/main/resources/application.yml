spring:
  application:
    name: rabbitmq-example
  rabbitmq:
    host: localhost
    username: guest
    password: guest
    port: 5672

properties:
  rabbitmq:
    exchange-name: user.events.header
    mobile-queue-name: mobile.notification.user-created
    desktop-queue-name: desktop.notification.user-created
    header-conditions:
      user-created: true
      user-authorized: true

server:
  port: 8080